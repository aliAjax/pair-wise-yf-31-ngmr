<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>航班恢复控制台</title>
<style>
body{font:14px system-ui;max-width:1180px;margin:32px auto;background:#eef2f7;color:#182230;padding:0 20px}
section{background:white;padding:18px 20px;border-radius:12px;margin:14px 0;box-shadow:0 2px 10px #0001}
h1{margin-bottom:4px}h2{margin:4px 0 12px;font-size:16px}
input,button{font:inherit;padding:8px;margin:4px}
button{background:#0f766e;color:white;border:0;border-radius:6px;cursor:pointer}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #e5e7eb;padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f8fafc;color:#475569}
.local{color:#0f766e;font-weight:600}.utc{color:#64748b}.tag{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;margin-right:4px}
.stale{background:#fef3c7;color:#92400e}.valid{background:#dcfce7;color:#166534}.invalid{background:#fee2e2;color:#991b1b}.locked{background:#dbeafe;color:#1e40af}
.muted{color:#94a3b8}pre{background:#111827;color:#93c5fd;padding:12px;overflow:auto;border-radius:8px;font-size:12px;max-height:260px}
</style>
<h1>航班恢复控制台</h1>
<p class="muted">所有时刻以 UTC 存储，按机场时区换算显示当地时间；宵禁按到达地当地挂钟判定。
夏令时固定口径：空档（gap）顺延、重复小时取第一次（fold=0）。写操作携带 X-User-Id、X-Role。</p>
<section>
  <input id="u" value="ops"><input id="r" value="ops_manager">
  <button onclick="load()">刷新</button><span id="clock" class="muted"></span>
</section>
<section><h2>机场（时区与当地宵禁）</h2><div id="airports"></div></section>
<section><h2>航班</h2><div id="flights"></div></section>
<section><h2>恢复方案</h2><div id="plans"></div></section>
<section><h2>原始状态</h2><pre id="o"></pre></section>
<script>
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function tag(cls,t){return `<span class="tag ${cls}">${esc(t)}</span>`}
function planStatus(p){
  if(p.status==='locked')return tag('locked','已锁定 · 按锁定当时时区');
  if(p.conclusion_status==='stale')return tag('stale','结论已失效 · 需重新校验');
  if(p.conclusion_status==='valid')return tag('valid','校验通过');
  if(p.conclusion_status==='invalid')return tag('invalid','校验不通过');
  return tag('muted','未校验');
}
async function load(){
  let x=await fetch('/api/state',{headers:{'X-User-Id':u.value,'X-Role':r.value}});
  let d=await x.json();
  clock.textContent='服务器 UTC：'+d.server_time;
  airports.innerHTML='<table><tr><th>机场</th><th>时区</th><th>当地宵禁</th><th>时区版本</th><th>更新人</th></tr>'+
    d.airports.map(a=>`<tr><td>${esc(a.code)}</td><td>${esc(a.timezone)}</td><td>${esc(a.curf_start||a.curfew_start)}–${esc(a.curfew_end)} 当地</td><td>v${a.tz_version}</td><td>${esc(a.tz_updated_by||'—')}</td></tr>`).join('')+'</table>';
  flights.innerHTML='<table><tr><th>航班</th><th>航线</th><th>起飞（当地 / UTC）</th><th>到达（当地 / UTC）</th><th>状态</th></tr>'+
    d.flights.map(f=>`<tr><td>${esc(f.flight_no)}</td><td>${esc(f.origin)} → ${esc(f.destination)}</td>
      <td><span class="local">${esc(f.origin_local||'')}</span><br><span class="utc">${esc(f.std)} (${esc(f.origin_timezone||'')})</span></td>
      <td><span class="local">${esc(f.destination_local||'')}</span><br><span class="utc">${esc(f.sta)} (${esc(f.destination_timezone||'')})</span></td>
      <td>${esc(f.status)}</td></tr>`).join('')+'</table>';
  plans.innerHTML=d.plans.map(p=>{
    let rows=p.assignments.map(a=>`<tr><td>${esc(a.flight_no)}</td><td>${esc(a.origin)}→${esc(a.destination)}</td>
      <td><span class="local">${esc(a.origin_local||'')}</span><br><span class="utc">${esc(a.new_std)}</span></td>
      <td><span class="local">${esc(a.destination_local||'')}</span><br><span class="utc">${esc(a.new_sta)}</span></td></tr>`).join('');
    return `<h2>#${p.id} ${esc(p.name)} ${planStatus(p)} <span class="muted">revision ${p.revision}</span></h2>
      <table><tr><th>航班</th><th>航线</th><th>起飞 当地/UTC</th><th>到达 当地/UTC</th></tr>${rows}</table>`;
  }).join('') || '<p class="muted">暂无方案</p>';
  o.textContent=JSON.stringify(d,null,2);
}
load();
</script>
